<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowFPV - En construction</title>
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <style>
        body {
            background-color: #0f172a; 
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .logo {
            height: 60px;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 500px;
            line-height: 1.6;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background-color: transparent;
            color: #3b82f6;
            text-decoration: none;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #3b82f6;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <img src="images/logo.svg" alt="Logo FlowFPV" class="logo">
    
    <h1>Site en construction</h1>
    <p>La boutique FlowFPV prépare actuellement ses services de conception sur-mesure (Li-ion, Impression 3D, Électronique).</p>
    <p>Ouverture très prochainement !</p>

    <a href="https://instagram.com/flowfpv.top" target="_blank" class="btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
        Nous suivre sur Instagram
    </a>
</body>
</html>
